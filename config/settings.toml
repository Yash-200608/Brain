# Jarvis Brain — runtime settings

[api]
host = "0.0.0.0"
port = 8000

[llm]
ollama_base_url = "http://localhost:11434"
provider        = "ollama"
planner_model   = "llama3.1:8b"
executor_model  = "llama3.1:8b"
critic_model    = "llama3.1:8b"

[identity]
# V2 foundation — non-enforcing. api_keys live in .env (JARVIS_API_KEYS).
default_user_id = "owner"

[sessions]
max_sessions = 256

[embeddings]
model    = "sentence-transformers/all-MiniLM-L6-v2"
reranker = "cross-encoder/ms-marco-MiniLM-L-6-v2"

[memory]
top_k     = 8
overshoot = 3

[retrieval]
weight_semantic   = 0.55
weight_keyword    = 0.15
weight_importance = 0.10
weight_access     = 0.10
weight_recency    = 0.10

[critic]
confidence_threshold = 0.65
max_retries          = 2

[logging]
level = "INFO"
