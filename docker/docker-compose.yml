services:
  jarvis-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: jarvis-brain-api
    ports:
      - "8000:8000"
    environment:
      JARVIS_OLLAMA_BASE_URL: http://ollama:11434
      JARVIS_LOG_LEVEL: INFO
    volumes:
      - ../data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: jarvis-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  # The dashboard is static vanilla JS — serve it directly, no node build.
  frontend:
    image: nginx:alpine
    container_name: jarvis-frontend
    ports:
      - "5173:80"
    volumes:
      - ../frontend/dashboard:/usr/share/nginx/html:ro
    depends_on:
      - jarvis-api
    restart: unless-stopped

volumes:
  ollama-data:
